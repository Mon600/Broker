spring:
  application:
    name: store
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_TIMEOUT:200ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.shastage.store.infrastructure.message_broker.events.ProductEvent
        spring.json.trusted.packages: com.shastage.store.infrastructure.message_broker.events
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  web:
    error:
      include-stacktrace: never

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger/index.html

logging:
  level:
    root: INFO
    com.shopapi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{40} - %msg%n"
  file:
    name: logs/shop-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
